name: Windows VST3
on:
  push:
    branches: ["codex/voltage-garden-implementation"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: voltage-garden-windows-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish build started
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python scripts/publish-ci-status.py running
      - name: Pin CMake
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
          if ($LASTEXITCODE -ne 0) { throw 'CMake install failed' }
          python -c "import cmake; print(cmake.CMAKE_BIN_DIR)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -c "import ninja; print(ninja.BIN_DIR)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure MSVC x64
        id: configure
        run: pwsh -NoLogo -NoProfile -File scripts/windows-command.ps1 scripts/ci-command.py out/ci/configure.log cmake --preset windows
      - name: Compile VST3, standalone and tests
        id: build
        run: pwsh -NoLogo -NoProfile -File scripts/windows-command.ps1 scripts/ci-command.py out/ci/build.log cmake --build --preset windows
      - name: Run DSP and processor tests
        id: tests
        shell: pwsh
        run: |
          New-Item out/tests -ItemType Directory -Force | Out-Null
          python scripts/ci-command.py out/ci/tests.log ctest --preset windows --output-junit "${{ github.workspace }}/out/tests/windows.xml"
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed' }
      - name: Capture running editor and test cable drag
        id: gui
        run: python scripts/ci-command.py out/ci/gui.log "build/windows/garden_integration_artefacts/Release/garden_integration.exe" --screenshots
      - name: Verify offline WAV file export
        run: python scripts/ci-command.py out/ci/audio.log "build/windows/garden_integration_artefacts/Release/garden_integration.exe" --audio
      - name: Build pinned pluginval
        run: pwsh -NoLogo -NoProfile -File scripts/windows-command.ps1 scripts/ci-command.py out/ci/validator-build.log pwsh -NoLogo -NoProfile -File scripts/build-validator.ps1
      - name: Validate actual VST3
        id: validator
        shell: pwsh
        run: |
          python scripts/ci-command.py out/ci/validator.log out/pluginval-build/pluginval_artefacts/Release/pluginval.exe --strictness-level 5 --validate "${{ github.workspace }}/build/windows/VoltageGarden_artefacts/Release/VST3/Voltage Garden.vst3" --output-dir "${{ github.workspace }}/out/validation"
          if ($LASTEXITCODE -ne 0) { throw 'pluginval failed' }
      - name: ZIP, Inno installer and SHA256
        id: package
        run: python scripts/ci-command.py out/ci/package.log pwsh -NoLogo -NoProfile -File scripts/package.ps1
      - name: Test ZIP, installer and uninstaller
        id: package_check
        run: python scripts/ci-command.py out/ci/package-check.log pwsh -NoLogo -NoProfile -File scripts/verify-package.ps1
      - name: Upload Windows deliverables
        id: artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoltageGarden-Windows-x64-${{ github.sha }}
          path: |
            out/release/*
            out/screenshots/*
            out/audio/*
            out/validation/*
            out/tests/windows.xml
            out/ci/*.log
            build/windows/VoltageGarden_artefacts/Release/VST3/Voltage Garden.vst3
          if-no-files-found: error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-failure-${{ github.sha }}
          path: |
            build/windows/Testing/Temporary/*
            out/tests/windows.xml
            out/ci/*.log
            out/validation/*
            out/screenshots/*
            out/audio/*
      - name: Publish build result through Git
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          REPORT_ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
          REPORT_ARTIFACT_ID: ${{ steps.artifacts.outputs.artifact-id }}
          REPORT_STEPS: ${{ toJSON(steps) }}
        run: python scripts/publish-ci-status.py "${{ job.status }}"
