name: Windows VST3
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin CMake
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { throw 'CMake install failed' }
          python -c "import cmake; print(cmake.CMAKE_BIN_DIR)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure MSVC x64
        run: cmake --preset windows
      - name: Compile VST3, standalone and tests
        run: cmake --build --preset windows
      - name: Run DSP and processor tests
        shell: pwsh
        run: |
          New-Item out/tests -ItemType Directory -Force | Out-Null
          ctest --preset windows --output-junit "${{ github.workspace }}/out/tests/windows.xml"
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed' }
      - name: Capture running editor and test cable drag
        run: '& "build/windows/garden_integration_artefacts/Release/garden_integration.exe" --screenshots'
      - name: Verify offline WAV file export
        run: '& "build/windows/garden_integration_artefacts/Release/garden_integration.exe" --audio'
      - name: Build pinned pluginval
        shell: pwsh
        run: |
          git clone https://github.com/Tracktion/pluginval.git out/pluginval
          if ($LASTEXITCODE -ne 0) { throw 'pluginval clone failed' }
          git -C out/pluginval checkout ed19c2c16b57a6d94db391bea3ef4a80b769d5bf
          git -C out/pluginval submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'pluginval dependencies failed' }
          cmake -S out/pluginval -B out/pluginval-build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'pluginval configure failed' }
          cmake --build out/pluginval-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'pluginval build failed' }
      - name: Validate actual VST3
        shell: pwsh
        run: |
          & out/pluginval-build/pluginval_artefacts/Release/pluginval.exe --strictness-level 5 --validate "${{ github.workspace }}/build/windows/VoltageGarden_artefacts/Release/VST3/Voltage Garden.vst3" --output-dir "${{ github.workspace }}/out/validation"
          if ($LASTEXITCODE -ne 0) { throw 'pluginval failed' }
      - name: ZIP, Inno installer and SHA256
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload Windows deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VoltageGarden-Windows-x64-${{ github.sha }}
          path: |
            out/release/*
            out/screenshots/*
            out/audio/*
            out/validation/*
            out/tests/windows.xml
            build/windows/VoltageGarden_artefacts/Release/VST3/Voltage Garden.vst3
          if-no-files-found: error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-failure-${{ github.sha }}
          path: |
            build/windows/Testing/Temporary/*
            out/tests/windows.xml
            out/validation/*
            out/screenshots/*
            out/audio/*
